[package]
name = "dlcore"
version = "0.1.0"
edition = "2024"
publish = false
description = "Driftloom's audio core: the synth's voices, host-agnostic"
license-file = "../LICENSE"

# No dependencies, by design (roadmap 16).
[dependencies]

[lib]
# A plain Rust library: native tests, the test host and any later host
# link it. The WebAssembly module the worklet loads is the same library
# built as a cdylib with the `web` feature (tools/build-core.sh). A `no_std`
# library cannot be a cdylib on its own: the final module needs a panic
# handler, and only the web host's build should bring one, or any program
# that links the library alongside `std` would have two.
crate-type = ["rlib"]

[features]
# Room for sample rates up to 192 kHz: the mix's delay lines, the master's
# wobble and the noise are fixed arrays sized for the highest rate a build
# supports (nothing allocates after start), and 192 kHz takes twice the
# memory of 96 kHz (about 3 MB more). On by default for hosts that want the
# charter's whole range (22,050 to 192,000 Hz); the web build leaves it off
# (tools/build-core.sh): a browser's context runs at 96 kHz at most, and the
# app keeps the memory it has.
default = ["wide"]
wide = []

# The WebAssembly exports `js/worklet.js` calls (`src/wasm.rs`) and the
# module's panic handler. Only tools/build-core.sh turns it on.
web = []

# The generator's WebAssembly exports (`src/wasm.rs`, `dl_spec` and the
# rest), for the build tools/gen-core.sh checks the generation goldens with
# (queue item 79). Not in the app's .wasm until the player is (item 82).
generator = ["web"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
