# How the golden renders (tools/golden.sh) build and run on the targets that
# are not this machine: the cross linkers apt installs (gcc-aarch64-linux-gnu
# and its siblings) and QEMU's user mode, which runs a foreign binary on this
# kernel (qemu-user). Nothing here touches the app's wasm build
# (wasm32-unknown-unknown): tools/build-core.sh sets its own rustflags.
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
runner = ["qemu-aarch64", "-L", "/usr/aarch64-linux-gnu"]

[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"
runner = ["qemu-arm", "-L", "/usr/arm-linux-gnueabihf"]

# Big-endian and 32-bit: a stand-in for a GameCube-style port.
[target.powerpc-unknown-linux-gnu]
linker = "powerpc-linux-gnu-gcc"
runner = ["qemu-ppc", "-L", "/usr/powerpc-linux-gnu"]

# Emscripten (queue item 87): the build Broken Friends' web export links,
# checked in CI on the goldens. A program runs in Node, with the machine's
# files (NODERAWFS: the golden lists and the WAVs), no threads (dlrender runs
# its render on the main thread there), and room on the stack for a core and
# a player, which a few calls build there.
[target.wasm32-unknown-emscripten]
runner = ["node"]
rustflags = ["-C", "link-arg=-sNODERAWFS=1", "-C", "link-arg=-sALLOW_MEMORY_GROWTH=1", "-C", "link-arg=-sSTACK_SIZE=67108864", "-C", "link-arg=-sINITIAL_MEMORY=134217728", "-C", "link-arg=-sEXIT_RUNTIME=1"]
