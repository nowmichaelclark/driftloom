<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512"><stop offset="0" stop-color="#2c1a4a"/><stop offset="0.43" stop-color="#5a3060"/><stop offset="0.79" stop-color="#e08a5a"/></linearGradient>
  <linearGradient id="lake" gradientUnits="userSpaceOnUse" x1="0" y1="404" x2="0" y2="512"><stop offset="0" stop-color="#4a2a58"/><stop offset="1" stop-color="#1c0e2c"/></linearGradient>
  <linearGradient id="rock" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="404"><stop offset="0" stop-color="#2a1740"/><stop offset="1" stop-color="#150a20"/></linearGradient>
  <linearGradient id="water" gradientUnits="userSpaceOnUse" x1="512" y1="188" x2="256" y2="404"><stop offset="0" stop-color="#fff4dc"/><stop offset="1" stop-color="#ffd4a0"/></linearGradient>
  <radialGradient id="sun" cx="0.42" cy="0.38" r="0.7"><stop offset="0" stop-color="#fff2c8"/><stop offset="0.6" stop-color="#ffd890"/><stop offset="1" stop-color="#ffc47a"/></radialGradient>
  <radialGradient id="glow"><stop offset="0.45" stop-color="#ffd890" stop-opacity="0.32"/><stop offset="1" stop-color="#ffd890" stop-opacity="0"/></radialGradient>
  <radialGradient id="mist"><stop offset="0" stop-color="#fff4dc" stop-opacity="0.6"/><stop offset="1" stop-color="#fff4dc" stop-opacity="0"/></radialGradient>
  <radialGradient id="spray"><stop offset="0" stop-color="#ffc89a" stop-opacity="0.28"/><stop offset="1" stop-color="#ffc89a" stop-opacity="0"/></radialGradient>
  <linearGradient id="refl" gradientUnits="userSpaceOnUse" x1="0" y1="408" x2="0" y2="490"><stop offset="0" stop-color="#ffe2b8" stop-opacity="0.5"/><stop offset="1" stop-color="#ffe2b8" stop-opacity="0"/></linearGradient>
  <linearGradient id="sunrefl" gradientUnits="userSpaceOnUse" x1="0" y1="406" x2="0" y2="500"><stop offset="0" stop-color="#ffc878" stop-opacity="0.35"/><stop offset="1" stop-color="#ffc878" stop-opacity="0"/></linearGradient>
  <clipPath id="w">
