# The Rust core, on every PR and every push to main: the committed
# js/dlcore.wasm must be exactly what its source builds (tools/build-core.sh
# --check), the core's own tests must pass, and so must the worklet's, the
# host's and the generator's, and the core's renders must match the committed
# baseline (tools/baseline.mjs, queue item 32): any change to what the core
# plays fails here until a PR updates test/core-baseline.json on purpose.
#
# The second job, `golden`, renders the golden note lists (core/golden/,
# queue item 42) on every target the core is meant to run on and compares
# the hashes with the ones kept for that target: wasm32 in Node, x86-64
# natively, and aarch64, 32-bit ARM and big-endian 32-bit PowerPC under
# QEMU's user mode. The targets run side by side, and the slowest (QEMU
# renders about 20 times slower than the machine) sets the wall time. Since
# the core carries its own math (item 43) every target must make exactly
# wasm32's hashes (--strict), and x86-64 renders them once more with the
# processor flushing subnormal numbers to zero, as Chromium's audio threads
# do, which must change nothing (--flush). The stereo render (queue item 64)
# has its own hash files and goes through the same steps (--stereo).
#
# The toolchain is pinned in core/rust-toolchain.toml; rustup, already on
# the runner, installs that exact version and its wasm32 target on first
# use, so nothing here names a version.
name: core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    # Pinned: Playwright 1.56.1 (below, the baseline's Chromium) can't
    # install Chromium's dependencies on ubuntu-latest since it became
    # 26.04 ("does not support chromium on ubuntu26.04-x64").
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The committed .wasm matches its source
        run: tools/build-core.sh --check
      - name: Core tests
        working-directory: core
        run: cargo test --locked
      - name: Worklet tests
        run: node test/worklet.test.mjs
      - name: Core host tests
        run: node test/core-host.test.mjs
      - name: Scheduler tests
        run: node test/engine.test.mjs
      - name: Generator tests
        run: node test/generator.test.mjs
      - name: Dials tests
        run: node test/dials.test.mjs
      - name: Word fit and word album tests
        run: node test/fit.test.mjs
      - name: Golden-render tests
        run: node test/golden.test.mjs
      - name: Draw tests (the page's copy of the core's generator)
        run: node test/draw.test.mjs
      - name: Next picks tests
        run: node test/picks.test.mjs
      # Level, tone and what folds back at 22,050 to 192,000 Hz against 48 kHz
      # (queue item 45); makes the 192 kHz build of the core for itself.
      - name: The core at other sample rates
        run: node tools/rates.mjs
      # Playwright pinned to the version whose Chromium the baseline was
      # rendered with; the tool is a dependency of the tools, not the app.
      - name: Chromium, for the baseline
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: The core against its baseline
        run: node tools/baseline.mjs

  golden:
    name: golden renders (${{ matrix.target }})
    runs-on: ubuntu-latest
    # The PowerPC job, under QEMU, renders the plain goldens mono and
    # stereo: 57 to 62 minutes since the stereo steps (queue item 64).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-unknown-unknown
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            packages: qemu-user gcc-aarch64-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            packages: qemu-user gcc-arm-linux-gnueabihf
          - target: powerpc-unknown-linux-gnu
            packages: qemu-user gcc-powerpc-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: QEMU and the cross linker
        if: matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      # The first cargo call installs the pinned toolchain; then its
      # standard library for the target (the wasm32 job needs no Rust: it
      # renders the committed js/dlcore.wasm in Node).
      - name: The target's standard library
        if: matrix.target != 'wasm32-unknown-unknown'
        working-directory: core
        run: |
          cargo --version
          rustup target add ${{ matrix.target }}
      - name: Render the golden note lists
        run: tools/golden.sh --strict ${{ matrix.target }}
      - name: The same, flushing subnormal numbers
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: tools/golden.sh --strict --flush ${{ matrix.target }}
      # The speaker output must not depend on how many frames a host asks
      # for a call (queue item 45): every list on x86-64 and wasm32, three
      # short ones under QEMU on aarch64 and armv7. The PowerPC job (the
      # slowest by far) renders the plain goldens only (Mikey, 2026-10-14).
      - name: The same at every block size
        if: matrix.target != 'powerpc-unknown-linux-gnu'
        run: tools/golden.sh --blocks ${{ (matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'wasm32-unknown-unknown') && 'all' || '' }} ${{ matrix.target }}
      # And at other sample rates, one hash file for every target.
      - name: The same at 22,050 to 192,000 Hz
        if: matrix.target != 'powerpc-unknown-linux-gnu'
        run: tools/golden.sh --rates ${{ matrix.target }}
      # The stereo render (queue item 64), held to its own hashes the same
      # way: plain on every target, and the modes where the mono render
      # runs them.
      - name: Stereo, the golden note lists
        run: tools/golden.sh --stereo --strict ${{ matrix.target }}
      - name: Stereo, flushing subnormal numbers
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: tools/golden.sh --stereo --strict --flush ${{ matrix.target }}
      - name: Stereo, at every block size
        if: matrix.target != 'powerpc-unknown-linux-gnu'
        run: tools/golden.sh --stereo --blocks ${{ (matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'wasm32-unknown-unknown') && 'all' || '' }} ${{ matrix.target }}
      - name: Stereo, at 22,050 to 192,000 Hz
        if: matrix.target != 'powerpc-unknown-linux-gnu'
        run: tools/golden.sh --stereo --rates ${{ matrix.target }}
