# The fast gate (queue item 103), on every PR and every push to main: the
# checks that hold a merge until the app is 1.0 and on F-Droid (Mikey,
# 2026-11-10: no session waits on the slow renders). Each job is one part of
# tools/gate.sh, so what CI runs and what a session runs locally are the same
# lines; the parts run side by side and the slowest sets the wall time, aimed
# under 15 minutes.
#
#   core      the committed js/dlcore.wasm and js/dlplayer.wasm are exactly
#             what their source builds (tools/build-core.sh --check), the
#             core's own tests, and clippy pedantic at zero
#   sketch    the same tests and clippy with the sketch folder built in
#             (queue item 83); never in the app's .wasm
#   node      the Node tests (test/*.test.mjs), the generation goldens in
#             Node (queue item 77), and the balance lock on the Rust
#             generator (queue item 80)
#   baseline  the player's renders against test/core-baseline.json (queue
#             items 32 and 96), the "nothing moved" guard, in three groups of
#             its parts: any change to what the core plays fails here until a
#             PR updates the baseline on purpose
#
# Everything slower is in nightly.yml and never holds a merge: every target's
# golden renders, Emscripten, Endless for 24 hours, the generation goldens in
# Chromium, rendering ahead's sweep, the other sample rates and the balance
# lock's own corpus. They come back as gates at 1.0 on F-Droid.
#
# The toolchain is pinned in core/rust-toolchain.toml; rustup, already on
# the runner, installs that exact version and its wasm32 target on first
# use, so nothing here names a version.
name: core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A PR's newer push replaces its older run; pushes to main each run.
concurrency:
  group: core-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The committed .wasm, the core's tests, clippy
        run: tools/gate.sh core

  sketch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: The core's tests and clippy, sketch build
        run: tools/gate.sh sketch

  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The Node tests, the generation goldens, the balance lock on the Rust generator
        run: tools/gate.sh node

  baseline:
    name: baseline (${{ matrix.parts }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The loops, the stereo render and the player's fingerprints read
        # the same renders, so they share a job.
        parts: ['loops,stereo,player,costs', 'voices', 'refusals']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # On the player in Node since queue item 96: no browser.
      - name: The core against its baseline
        run: tools/gate.sh baseline ${{ matrix.parts }}
