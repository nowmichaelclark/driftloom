# The app's audio export in a real browser (queue item 104b), on PRs that
# touch it and by hand. Not part of the gate (core.yml's flac job holds the
# export's files to straight renders in Node); these need Chromium, and the
# long one takes an hour or two.
#
#   rows   tools/rows.mjs: every control of the app on the core's player,
#          the export's rows among them (the sheet, a minute at both speeds,
#          Cancel, the free space checked first, a disk that fills
#          mid-export, the private file and its download)
#   views  (by hand: jobs = views) tools/views.mjs on every view with a
#          32,768-bar piece open (session 18, queue item 106b): the long
#          tasks per view, the new drawing's among them
#   long   tools/export-long.mjs: a three-hour export (lossless, or small:
#          Opus through the browser's encoder, queue item 104c) on
#          tools/autolite.mjs's slow case (burn 1700 us, lighter on processor
#          on) while the music plays: memory flat, nothing late or behind,
#          and the file decodes and nulls against a straight render
#          (lossless) or decodes clean, whole and aligned (small)
#
# By hand: `jobs` (rows, views, long or all), `repeat` (the rows, that many
# times in a row, all must pass), `length` (seconds, one of the sheet's
# lengths), `burn` and `format` (lossless or small) for the long job.
name: export

on:
  pull_request:
    paths:
      - 'js/export*.js'
      - 'js/ogg.js'
      - 'js/main.js'
      - 'js/piece.js'
      - 'js/picks.js'
      - 'js/library.js'
      - 'js/ui.js'
      - 'js/request.js'
      - 'js/worklet.js'
      - 'css/style.css'
      - 'tools/views.mjs'
      - 'js/dlplayer.wasm'
      - 'index.html'
      - 'tools/rows.mjs'
      - 'tools/export*.mjs'
      - 'tools/ogg-read.mjs'
      - '.github/workflows/export.yml'
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Which jobs: rows, views, long or all'
        default: 'all'
      repeat:
        description: 'The rows, this many times in a row'
        default: '1'
      length:
        description: 'The long export, in seconds (one of the sheet lengths)'
        default: '10800'
      burn:
        description: 'Microseconds added to each block the playing core renders'
        default: '1700'
      format:
        description: 'The format of the long export: lossless or small'
        default: 'lossless'

permissions:
  contents: read

concurrency:
  group: export-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rows:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'rows'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright's Chromium
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: The app's rows, the export's among them
        run: |
          for i in $(seq 1 "${{ github.event.inputs.repeat || '1' }}"); do
            echo "=== rows, run $i ==="
            node tools/rows.mjs || exit 1
          done

  views:
    if: github.event_name == 'workflow_dispatch' && (inputs.jobs == 'views' || inputs.jobs == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright's Chromium
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Every view with a 32,768-bar piece open
        run: node tools/views.mjs --loops piece,arc --throttle 4,6 --quality full,lite --md views.md && cat views.md


  long:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'long'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright's Chromium, and the reference decoder
        run: |
          sudo apt-get update && sudo apt-get install -y flac ffmpeg
          npm install --no-save --no-audit --no-fund playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: A long export while the music plays
        run: node tools/export-long.mjs --length "${{ github.event.inputs.length || '10800' }}" --burn "${{ github.event.inputs.burn || '1700' }}" --format "${{ github.event.inputs.format || 'lossless' }}"
