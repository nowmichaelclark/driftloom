org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# What 31a (the new name) changes, one line each (docs/DECISIONS.md,
# 2026-11-11). The launcher's label is the third: `app_name` in
# app/src/main/res/values/strings.xml.
#
# The working id of the test builds. Debug-signed, so a release under another
# id could never update over them anyway.
driftloom.applicationId=io.github.nowmichaelclark.driftloom
# The app's name: the APK's file name and the build's own messages.
driftloom.appName=Driftloom

# The test builds' version. CI passes -Pdriftloom.versionCode=<run number>,
# so each build can be installed over the one before it.
driftloom.versionCode=1
driftloom.versionName=0.1.0-test
