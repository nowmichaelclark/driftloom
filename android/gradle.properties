org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# What 31a (the new name) changes, one line each (docs/DECISIONS.md,
# 2026-11-11). The launcher's label is the third: `app_name` in
# app/src/main/res/values/strings.xml.
#
# The working id of the test builds. Debug-signed, so a release under another
# id could never update over them anyway.
driftloom.applicationId=io.github.nowmichaelclark.driftloom
# The app's name: the APK's file name and the build's own messages.
driftloom.appName=Driftloom

# The version (session 29, queue item 107e; android/README.md, "Versions").
# A release is "major.minor" or "major.minor.patch", its code
# major * 10000 + minor * 100 + patch (1.0 is 10000, 1.2.3 is 10203), and the
# tag v<versionName> builds it. F-Droid reads both from here, at the tagged
# commit. A test build's name ends in -test, and CI passes
# -Pdriftloom.versionCode=<run number>, so each can be installed over the one
# before it. Session 31 sets 1.0.
driftloom.versionCode=1
driftloom.versionName=0.1.0-test

# The core, native (session 26): the NDK its libraries are linked with
# (android/native/build.sh; r28c, pinned), and the ABIs they are built for.
driftloom.ndkVersion=28.2.13676358
driftloom.abis=arm64-v8a,armeabi-v7a,x86_64
